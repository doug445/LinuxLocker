blank_issues_enabled: false
contact_links:
  - name: The machine will not boot
    url: https://github.com/doug445/LinuxLocker/blob/main/docs/RECOVERY.md
    about: Interrupted encryption, corrupt headers, unbootable systems. Most cases are already documented here — read this first.
  - name: Security vulnerability
    url: https://github.com/doug445/LinuxLocker/blob/main/SECURITY.md
    about: Do not open a public issue. Report privately by email — see SECURITY.md.
  - name: Test report — did it work on your setup?
    url: https://github.com/doug445/LinuxLocker/blob/main/CONTRIBUTING.md#most-wanted-test-reports-from-other-setups
    about: UKI, systemd-boot, Secure Boot, xfs, f2fs, Raspberry Pi and aarch64 hardware are all unconfirmed on metal. A report that it WORKED is as valuable as a bug.
  - name: What this project accepts
    url: https://github.com/doug445/LinuxLocker/blob/main/CONTRIBUTING.md
    about: Serious bugs and new filesystem support, and nothing else. Read before opening anything.
  - name: Which filesystems are supported, and why
    url: https://github.com/doug445/LinuxLocker/blob/main/docs/FILESYSTEMS.md
    about: The full matrix, the 32 MiB shrink rule, and the workarounds for xfs, exfat, udf and swap.
